name: Retry Update Bucket

# Reruns a failed Update Bucket run after a delay. This also covers a run that
# failed before any job started, which the in-step retries cannot reach. The
# failure email for the first attempt is sent regardless.
on:
  workflow_run:
    workflows: [Update Bucket]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A full rerun, since a run that failed at startup has no failed jobs
      # for --failed to select.
      - name: Wait, then rerun the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 600
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"
