name: Update Bucket

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:      # Manual trigger

permissions: {}

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The network-bound steps retry after a delay, so a transient fault
      # does not fail the run. A run that fails anyway is rerun by retry.yml.
      - name: Clone Scoop for checkver script
        shell: bash
        run: |
          url=https://github.com/ScoopInstaller/Scoop.git
          for attempt in 1 2 3; do
            git clone "$url" --depth 1 "$RUNNER_TEMP/scoop-bin" && exit 0
            rm -rf "$RUNNER_TEMP/scoop-bin"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Clone attempt $attempt failed, retrying in 60 s"
              sleep 60
            fi
          done
          exit 1

      # Rerunning checkver after a partial failure is safe, since a manifest
      # it has already rewritten is checked again and left as it is.
      - name: Run checkver on all manifests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              $scoopBin = Join-Path $env:RUNNER_TEMP "scoop-bin"
              & "$scoopBin/bin/checkver.ps1" -Dir bucket -Update
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ' 2>&1 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::checkver attempt $attempt failed, retrying in 120 s"
              sleep 120
            fi
          done
          exit 1

      # Commits are created through the GraphQL API rather than with `git
      # commit`, so GitHub signs them and they show as Verified. A commit
      # pushed by git from a runner has no signing key available and is
      # therefore always unverified.
      - name: Commit changes through the API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const changed = execSync('git diff --name-only -- bucket/', { encoding: 'utf8' })
              .split('\n')
              .map(s => s.trim())
              .filter(Boolean);

            if (changed.length === 0) {
              core.info('No changes to commit');
              return;
            }

            // A retry sends the same expectedHeadOid. If a mutation succeeded
            // but its response was lost, the retry fails on the moved head
            // rather than committing the manifest twice.
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function withRetry(label, fn) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await fn();
                } catch (err) {
                  if (attempt === 3) throw err;
                  core.warning(`${label}: attempt ${attempt} failed (${err.message}), retrying in 30 s`);
                  await sleep(30000);
                }
              }
            }

            const branch = context.ref.replace('refs/heads/', '');
            let oid = execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();

            for (const path of changed) {
              // Commit the bytes on disk verbatim. Decoding to a string and
              // re-encoding would drop a BOM and rewrite line endings.
              const buf = fs.readFileSync(path);
              const app = path.split('/').pop().replace(/\.json$/, '');
              const version = JSON.parse(buf.toString('utf8').replace(/^\uFEFF/, '')).version;

              const result = await withRetry(app, () => github.graphql(
                `mutation($input: CreateCommitOnBranchInput!) {
                   createCommitOnBranch(input: $input) { commit { oid } }
                 }`,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                      branchName: branch,
                    },
                    message: { headline: `${app}: Update to version ${version}` },
                    expectedHeadOid: oid,
                    fileChanges: {
                      additions: [{ path, contents: buf.toString('base64') }],
                    },
                  },
                },
              ));

              oid = result.createCommitOnBranch.commit.oid;
              core.info(`${app}: ${version}  ${oid.slice(0, 8)}`);
            }

            core.info(`Committed ${changed.length} manifest update(s)`);
