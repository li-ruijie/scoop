name: Update Bucket

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:      # Manual trigger

permissions: {}

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone Scoop for checkver script
        run: git clone https://github.com/ScoopInstaller/Scoop.git --depth 1 "$RUNNER_TEMP/scoop-bin"
        shell: bash

      - name: Run checkver on all manifests
        shell: bash
        run: |
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            $scoopBin = Join-Path $env:RUNNER_TEMP "scoop-bin"
            & "$scoopBin/bin/checkver.ps1" -Dir bucket -Update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ' 2>&1

      # Commits are created through the GraphQL API rather than with `git
      # commit`, so GitHub signs them and they show as Verified. A commit
      # pushed by git from a runner has no signing key available and is
      # therefore always unverified.
      - name: Commit changes through the API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const changed = execSync('git diff --name-only -- bucket/', { encoding: 'utf8' })
              .split('\n')
              .map(s => s.trim())
              .filter(Boolean);

            if (changed.length === 0) {
              core.info('No changes to commit');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            let oid = execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();

            for (const path of changed) {
              // Commit the bytes on disk verbatim. Decoding to a string and
              // re-encoding would drop a BOM and rewrite line endings.
              const buf = fs.readFileSync(path);
              const app = path.split('/').pop().replace(/\.json$/, '');
              const version = JSON.parse(buf.toString('utf8').replace(/^\uFEFF/, '')).version;

              const result = await github.graphql(
                `mutation($input: CreateCommitOnBranchInput!) {
                   createCommitOnBranch(input: $input) { commit { oid } }
                 }`,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                      branchName: branch,
                    },
                    message: { headline: `${app}: Update to version ${version}` },
                    expectedHeadOid: oid,
                    fileChanges: {
                      additions: [{ path, contents: buf.toString('base64') }],
                    },
                  },
                },
              );

              oid = result.createCommitOnBranch.commit.oid;
              core.info(`${app}: ${version}  ${oid.slice(0, 8)}`);
            }

            core.info(`Committed ${changed.length} manifest update(s)`);
